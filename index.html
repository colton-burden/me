<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="description" content="Colton Burden" />
        <meta name="author" content="Colton Burden" />
        <title>Colton Burden</title>
        <link rel="canonical" href="https://coltonburden.com" />
        <link rel="icon" type="image/png" href="assets/apple-cat-spinning.gif" />
    </head>

    <style>
        :root {
            --bg: #3b3d6e;
            --accent: #96fe77;
            --text: #fdfef8;
        }

        body {
            background: var(--bg);
            display: flex;
            min-height: 100vh;
            max-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        img {
            max-width: 60vw;
            max-height: 60vh;
            height: auto;
            object-fit: contain;
        }
    </style>

    <body>
        <main>
            <img src="assets/apple-cat-spinning.gif" alt="Apple Cat Spinning (animated)" title="Apple Cat Spinning (not a loader btw)"/>
        </main>
    </body>
</html>
